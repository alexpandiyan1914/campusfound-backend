spring.application.name=campusfound

spring.datasource.url=jdbc:h2:mem:campusfound_test;MODE=PostgreSQL;NON_KEYWORDS=YEAR
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect


jwt.secret=CampusFoundTestJwtSecretKeyForAutomatedTestingOnly123456789
jwt.expiration=900000


imagekit.public-key=test-imagekit-public-key
imagekit.private-key=test-imagekit-private-key
imagekit.url-endpoint=https://ik.imagekit.io/campusfound-test


brevo.api-key=test-brevo-api-key
brevo.sender-email=test@campusfound.local
brevo.sender-name=CampusFound Test